- id: off_skill_pool_welcome
  name: (off) Welcome to skill pool email
  model_id: Lead/Opportunity
  subject: Welcome {{ object.partner_id.name }} to Open Food Facts Skill Pool
  email_rom:
  email_to: "{{ object.email_from }}"
  partner_to:
  reply_to:
  body_html: # see off_skill_pool_welcome.html
  language: >-
    {{ (object.partner_id.lang or "")[:2].lower() == "fr" and "fr_FR" or "en_US" }}
  auto_delete: True

- id: off_skill_pool_chatwoot
  name: (off) chatwoot email on new volunteer
  model_id: Lead/Opportunity
  subject: "skill pool: {{ object.partner_id.name }} just joined"
  email_from:
  email_to: contact@openfoodfacts.org
  partner_to:
  reply_to:
  body_html: # see off_skill_pool_chatwoot.html
  language: EN
  auto_delete: True
